services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: news_app
      MARIADB_USER: news_app_user
      MARIADB_PASSWORD: ${NEWS_DB_PASSWORD:?Set NEWS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${NEWS_DB_ROOT_PASSWORD:?Set NEWS_DB_ROOT_PASSWORD in .env}
    volumes:
      - news_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEWS_SECRET_KEY: ${NEWS_SECRET_KEY:?Set NEWS_SECRET_KEY in .env}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:?Set NEWS_DB_PASSWORD in .env}
      NEWS_DB_HOST: db
      NEWS_DEBUG: "true"
      NEWS_ALLOWED_HOSTS: ${NEWS_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py setup_roles &&
      python manage.py runserver 0.0.0.0:8000 --noreload"
volumes:
  news_data:
